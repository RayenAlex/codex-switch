[package]
name = "csw-ssh-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync", "time", "io-util", "rt-multi-thread", "net", "process"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["io-std"] }
