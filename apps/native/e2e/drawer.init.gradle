// Isolate gesture regression tests from the user's installed app and accounts.
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.drawertest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/DrawerFixture.tsx')
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'drawer-fixture.apk' }
        }
    }
}
