// Exercise the real download page and share bridge in an isolated application.
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.layout.buildDirectory.set(new File(project.projectDir, 'build-download-selection'))
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.downloaduitest'
        project.extensions.getByName('react').entryFile =
            new File(project.rootDir, '../e2e/DownloadManagerFixture.tsx')
        project.extensions.getByName('react').debuggableVariants = []
    }
}
