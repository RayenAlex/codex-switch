// Isolated from both the normal app and the existing terminal test fixture.
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.zmodemtest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/ZmodemFixture.tsx')
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'zmodem-fixture.apk' }
        }
    }
}
