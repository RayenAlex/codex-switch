// Isolate navigation badge checks from installed apps and other UI fixtures.
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.layout.buildDirectory.set(new File(project.projectDir, 'build-download-count'))
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.downloadcounttest'
        project.extensions.getByName('react').entryFile =
            new File(project.rootDir, '../e2e/DownloadCountFixture.tsx')
        project.extensions.getByName('react').debuggableVariants = []
    }
}
