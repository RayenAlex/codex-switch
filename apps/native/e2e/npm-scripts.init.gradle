// Use a separate application and output directory; preserve the user's installed app and data.
// Build with NODE_ENV=production and NODE_PATH pointing to apps/native/node_modules.
gradle.beforeProject { project ->
    if (project.path == ':app') {
        project.layout.buildDirectory.set(new File(project.rootDir, '../../../.codex-tmp/npm-scripts-mobile/build'))
    }
}
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.npmscriptstest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/NpmScriptsFixture.tsx')
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'npm-scripts-fixture.apk' }
        }
    }
}
