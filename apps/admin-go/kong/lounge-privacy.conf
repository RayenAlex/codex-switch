# Include in Kong's nginx http context. Append if=$remoteai_access_loggable to each proxy access_log.
# This filter does not disable separate logging/tracing plugins; exclude the same paths there too.
map $uri $remoteai_access_loggable {
    default 1;
    ~^/lounge(?:/|$) 0;
    ~^/admin/api/lounge(?:/|$) 0;
}
