name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (lint, typecheck, tests)
    runs-on: macos-15
    # Cold Rust builds plus the full lerna check can take a while on a fresh runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      # Runs every workspace "check" script (typecheck + build + backend tests),
      # then check:rust: cargo fmt --check, cargo test, and installer script checks.
      - name: Run checks
        run: npm run check
